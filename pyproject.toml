[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-qec"
version = "0.1.0"
description = "A lightweight AI for quantum error correction research scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
  "stim>=1.15",
  "sinter>=1.15",
  "pymatching>=2.0",
]
torch = ["torch>=2.2"]
plot = ["matplotlib>=3.8"]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
]
matching = ["pymatching>=2.0"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_qec*"]

[tool.ai_qec]
default_config = "configs/experiment.smoke.yaml"
