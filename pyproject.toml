[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-for-qec"
version = "0.1.0.dev0"
description = "Contract-first research infrastructure for AI quantum error correction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI-for-QEC contributors" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["ai_qec"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["ai_qec"]
