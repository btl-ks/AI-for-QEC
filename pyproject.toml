[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-for-qec"
version = "0.1.0.dev0"
description = "Contract-first research infrastructure for AI quantum error correction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI-for-QEC contributors" }]
dependencies = []

[project.optional-dependencies]
# Executable local runtime (Torlai–Melko paper workflow). Versions are those verified
# in openspec/technology-catalog.yaml; Stim must equal dataset.generator_version.
runtime = [
    "numpy>=2.0",
    "torch>=2.4",
    "stim==1.16.0",
    "pymatching>=2.2",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_qec*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "~/.cache/ruff"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["ai_qec"]
