schema_version: "0.1-contract"
technology_profile: v0-1

qec:
  code_family: toric
  distance: 3
  rounds: 1
  logical_basis: Z
  circuit_family: code-capacity
  circuit_adapter: qiskit-circuit

noise:
  family: independent-phase-flip
  adapter: stim-noise
  parameters:
    physical_error_rate: 0.05

dataset:
  generator: stim-syndrome-cpu
  generator_version: unresolved
  backend_semantics: exact
  train_samples: 1024
  validation_samples: 256
  test_samples: 256
  seed: 42
  split_policy: fixed
  schema_version: qec-batch-v1

model:
  family: unresolved
  architecture_version: unresolved

training:
  optimizer: unresolved
  learning_rate: 0.001
  epochs: 1
  batch_size: 32
  scheduler: none
  loss: unresolved

execution:
  trainer_framework: pytorch
  device: cpu
  cpu_count: 1
  gpu_count: 0
  distributed: false
  num_workers: 0
  mixed_precision: false
  compile_model: false
  step_executor: pytorch-eager
  step_executor_options: {}

scientific_evaluation:
  baseline_decoder: pymatching-cpu-decoder
  primary_metric: logical_error_rate
  confidence_level: 0.95
  tolerance: null  # 必须由具体研究 change 预注册后才能执行 Accuracy Gate。

data_pipeline:
  runtime_representation: pytorch-tensor
  cpu_to_gpu:
    technology: pytorch-dataloader-h2d
    pin_memory: true
    non_blocking: true
  gpu_to_gpu:
    technology: cuda-q-to-pytorch-cuda
    zero_copy_preferred: true
    allow_host_staging: false
