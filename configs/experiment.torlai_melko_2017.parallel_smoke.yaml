# Torlai and Melko (2017), arXiv:1610.04238, doi:10.1103/PhysRevLett.119.030501.
# This small run verifies the
# end-to-end reproduction path; it is not a threshold or accuracy claim.
schema_version: 1
# 平台加速 smoke：64 条并行 Gibbs 链；采样分布不能直接视为论文单链复现。
# 本机的 quantum 环境提供 PyTorch；其他机器可改为安装了 [torch] extra 的环境。
execution: {conda_env: quantum}
experiment:
  name: torlai_melko_2017_rbm_parallel_smoke
  title: "Parallel-chain PyTorch RBM Gibbs smoke for toric code capacity"
  description: "Project-local 64-chain acceleration variant of the Torlai--Melko RBM workflow; distinct from the single-chain paper smoke."
  owner: researcher
  tags: [ai-qec, toric-code, rbm, parallel-gibbs, platform-smoke]
topic: {direction: D1, subtopic: D1.2, name: generative_neural_decoding}
reproducibility: {seeds: [17], deterministic: true, save_environment: true, save_git_commit: true, require_clean_worktree: false}
qec: {code: toric_code, distance: 4, rounds: 1, task: code_capacity}
noise: {model: phase_flip, p_error: 0.08}
data:
  generator: toric_code_capacity
  train_samples: 256
  validation_samples: 64
  test_samples: 24
  dataset_id: torlai_melko_2017_l4_p008_parallel_smoke
  output_dir: datasets
  batch_size: 64
  preprocessing: {representation: error_syndrome}
model: {implementation: joint_error_syndrome_rbm, hidden_units: 16, init_width: 0.01}
training:
  trainer: rbm_cd
  device: cpu
  epochs: 8
  batch_size: 64
  learning_rate: 0.05
  cd_steps: 1
  weight_decay: 0.0001
  decoder: {burn_in: 25, max_steps: 400, parallel_chains: 64}
outputs: {runs_root: runs}
flow:
  - id: generate_data
    script: scripts/generate_data.py
    args: [--config, "${CONFIG}", --project-root, "${PROJECT_ROOT}"]
    outputs:
      - {path: "${DATASET_DIR}/dataset_manifest.json", artifact_type: dataset_manifest, schema_version: 1}
  - id: train
    script: scripts/train.py
    args: [--config, "${CONFIG}", --run-dir, "${RUN_DIR}", --project-root, "${PROJECT_ROOT}"]
    outputs:
      - {path: "${RUN_DIR}/checkpoints/best.pt", artifact_type: checkpoint}
      - {path: "${RUN_DIR}/checkpoints/last.pt", artifact_type: checkpoint}
      - {path: "${RUN_DIR}/training_summary.json", artifact_type: json}
  - id: evaluate
    script: scripts/evaluate.py
    args: [--config, "${CONFIG}", --run-dir, "${RUN_DIR}", --checkpoint, "${RUN_DIR}/checkpoints/best.pt", --project-root, "${PROJECT_ROOT}"]
    outputs:
      - {path: "${RUN_DIR}/predictions/toric_rbm_eval.npz", artifact_type: predictions}
      - {path: "${RUN_DIR}/metrics.json", artifact_type: json}
  - id: benchmark
    script: scripts/benchmark.py
    args: [--config, "${CONFIG}", --run-dir, "${RUN_DIR}", --project-root, "${PROJECT_ROOT}"]
    outputs:
      - {path: "${RUN_DIR}/metrics.json", artifact_type: json}
      - {path: "${RUN_DIR}/benchmark_report.json", artifact_type: json}
